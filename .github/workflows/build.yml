name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    
    env:
      OBS_VERSION: "30.0.0"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Clone OBS Studio and dependencies
        run: |
          # Clone OBS Studio source for headers
          git clone --depth=1 --branch $env:OBS_VERSION https://github.com/obsproject/obs-studio.git "$env:GITHUB_WORKSPACE\obs-studio"
          
          # Clone OBS dependencies for prebuilt libraries  
          git clone --depth=1 --branch $env:OBS_VERSION https://github.com/obsproject/obs-deps.git "$env:GITHUB_WORKSPACE\obs-deps"
        shell: pwsh
      
      - name: Configure and Build
        run: |
          $env:OBS_SOURCE_DIR = "$env:GITHUB_WORKSPACE\obs-studio"
          $env:OBS_DEPS_DIR = "$env:GITHUB_WORKSPACE\obs-deps\windows_build_64bit"
          
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_SYSTEM_PROCESSOR=AMD64 `
            -DOBS_OUTPUT_DIR="rundir" `
            -DOBS_SOURCE_DIR="$env:OBS_SOURCE_DIR" `
            -DOBS_DEPS_DIR="$env:OBS_DEPS_DIR" `
            -DCMAKE_PREFIX_PATH="$env:OBS_DEPS_DIR;$env:OBS_DEPS_DIR\lib\cmake;$env:GITHUB_WORKSPACE\obs-deps"
          
          cmake --build build --config Release --parallel
        shell: pwsh
      
      - name: Download Inno Setup
        run: |
          Invoke-WebRequest -Uri "https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe" -OutFile "innosetup.exe"
        shell: pwsh
      
      - name: Create Installer
        run: |
          .\innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="C:\inno"
          & "C:\inno\ISCC.exe" ".\installer\installer.iss"
        shell: pwsh
      
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: QTChat-Setup
          path: dist\*.exe
          retention-days: 5
      
      - name: Upload Plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: QTChat-DLL
          path: build\rundir\obs-plugins\64bit\QTChat.dll
          retention-days: 5

  release:
    name: Create Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download Installer
        uses: actions/download-artifact@v4
        with:
          name: QTChat-Setup
          path: dist/
      
      - name: Download DLL
        uses: actions/download-artifact@v4
        with:
          name: QTChat-DLL
          path: dist/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
