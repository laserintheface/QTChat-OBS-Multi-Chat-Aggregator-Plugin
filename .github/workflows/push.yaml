name: Build

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Up Environment
        id: setup
        run: |
          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          $ProductName = $BuildSpec.name
          $ProductVersion = $BuildSpec.version
          "pluginName=${ProductName}" >> $env:GITHUB_OUTPUT
          "pluginVersion=${ProductVersion}" >> $env:GITHUB_OUTPUT

      - name: Clone OBS Studio Source
        run: |
          $obsVersion = "31.0.3"
          Write-Host "Cloning OBS Studio $obsVersion with submodules..."
          git clone --depth=1 --branch $obsVersion --recurse-submodules https://github.com/obsproject/obs-studio.git obs-studio

      - name: Download OBS Dependencies
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $obsDepsVersion = "2025-08-23"
          $obsDepsUrl = "https://github.com/obsproject/obs-deps/releases/download/${obsDepsVersion}/windows-deps-${obsDepsVersion}-x64.zip"
          Write-Host "Downloading OBS dependencies ${obsDepsVersion}..."
          Invoke-WebRequest -Uri $obsDepsUrl -OutFile obs-deps.zip
          Expand-Archive obs-deps.zip -DestinationPath obs-deps -Force

      - name: Build OBS Studio
        run: |
          $env:OBS_STUDIO_DIR = "$PWD/obs-studio"
          $env:OBS_DEPS_DIR = "$PWD/obs-deps"
          $env:OBS_OUTPUT_DIR = "rundir"
          $env:CMAKE_PREFIX_PATH = "$env:OBS_DEPS_DIR"
          
          Write-Host "Building OBS Studio..."
          
          cmake -S "$env:OBS_STUDIO_DIR" -B "$env:OBS_STUDIO_DIR/build" -G "Visual Studio 17 2022" -A x64 -DCMAKE_SYSTEM_PROCESSOR=AMD64 -DCMAKE_PREFIX_PATH="$env:OBS_DEPS_DIR" -DCOVERAGE=OFF -DENABLE_TESTING=OFF -DENABLE_BROWSER=OFF -DENABLE_CAPTIONS=OFF -DENABLE_ENCODER_AOM=OFF -DENABLE_ENCODER_JPEG=OFF -DENABLE_ENCODER_PTHREAD=OFF -DENABLE_ENCODER_SRT=OFF -DENABLE_FFmpeg=OFF -DENABLE_JACK=OFF -DENABLE_MACOS_AUDIO=OFF -DENABLE_MACOS_CAPTURE=OFF -DENABLE_NATIVE_NVENC=OFF -DENABLE_PIPEWIRE=OFF -DENABLE_PORTAUDIO=OFF -DENABLE_QSV=OFF -DENABLE_Rdma=OFF -DENABLE_SCRIPTING=OFF -DENABLE_SKINS=OFF -DENABLE_SNDIO=OFF -DENABLE_SPEECH_RECOGNIZER=OFF -DENABLE_STUDIO_V3D=OFF -DENABLE_TEXT=OFF -DENABLE_TTF=OFF -DENABLE_VCE=OFF -DENABLE_VNC=OFF -DENABLE_WEBRTC=OFF -DENABLE_WINDOWS_CAPTURE=OFF -DOBS_OUTPUT_DIR="$env:OBS_OUTPUT_DIR"
          
          cmake --build "$env:OBS_STUDIO_DIR/build" --config RelWithDebInfo --parallel --target libobs obs-frontend-api

      - name: Configure Plugin
        run: |
          $workDir = "$PWD"
          $obsStudioDir = "$workDir/obs-studio"
          $obsDepsDir = "$workDir/obs-deps"
          
          $cmakePrefixPath = "$obsDepsDir;$obsStudioDir/build"
          $cmakeModulePath = "$obsStudioDir/cmake/Modules"
          
          Write-Host "Configuring plugin..."
          
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_SYSTEM_PROCESSOR=AMD64 -DOBS_OUTPUT_DIR="rundir" -DOBS_STUDIO_DIR="$obsStudioDir" -DOBS_DEPS_DIR="$obsDepsDir" -DCMAKE_PREFIX_PATH="$cmakePrefixPath" -DCMAKE_MODULE_PATH="$cmakeModulePath"

      - name: Build Plugin
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Package Plugin
        run: |
          $pluginName = "${{ steps.setup.outputs.pluginName }}"
          $pluginVersion = "${{ steps.setup.outputs.pluginVersion }}"
          $commitHash = "${{ github.sha }}".Substring(0, 9)
          
          $outputDir = "release"
          if (!(Test-Path $outputDir)) { New-Item -ItemType Directory -Path $outputDir }
          
          Copy-Item "build/rundir/obs-plugins/64bit/*.dll" -Destination $outputDir -Force
          
          Compress-Archive -Path "$outputDir/*" -DestinationPath "$pluginName-$pluginVersion-windows-x64-$commitHash.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ github.sha }}
          path: |
            ${{ github.workspace }}/release/*.zip
            ${{ github.workspace }}/build/rundir/obs-plugins/64bit/*.dll

  release:
    name: Create Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: ${{ steps.setup.outputs.pluginName }}-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            *.zip
            *.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
